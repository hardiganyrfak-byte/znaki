<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр дорожных знаков</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: одна колонка-«дорога», шапка с разметкой, по центру карточка вопроса */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#15202c; --muted:#5a6878; --line:#d6dde6;
  --accent:#1a5bb0; --accent-ink:#ffffff; --ok:#1d8a4b; --ok-bg:#e3f4ea; --bad:#c62828; --bad-bg:#fbe7e7; --mark:#f5c400;
  --asphalt:#2b323b;
  --display:"Unbounded", "Arial Black", sans-serif;
  --body:"Golos Text", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#1a212a; --ink:#e7ecf2; --muted:#94a1b0; --line:#2b3540;
  --accent:#5b95e3; --accent-ink:#0d1219; --ok:#41b874; --ok-bg:#16301f; --bad:#ef5f5f; --bad-bg:#3a1b1b; --mark:#f5c400; --asphalt:#0b0f13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#1a212a; --ink:#e7ecf2; --muted:#94a1b0; --line:#2b3540;
  --accent:#5b95e3; --accent-ink:#0d1219; --ok:#41b874; --ok-bg:#16301f; --bad:#ef5f5f; --bad-bg:#3a1b1b; --mark:#f5c400; --asphalt:#0b0f13; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
header{background:var(--asphalt);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 0}
.hwrap{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,4.6vw,28px);margin:0;letter-spacing:.01em;text-wrap:balance}
.tabs{display:flex;gap:6px}
.tab{font:600 14px var(--body);color:#cfd7e0;background:transparent;border:1px solid #4a5560;border-radius:999px;padding:8px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--mark);color:#1b1b1b;border-color:var(--mark)}
.road{height:6px;margin-top:18px;background:repeating-linear-gradient(90deg,var(--mark) 0 34px,transparent 34px 60px)}
main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-variant-numeric:tabular-nums}
.bar{flex:1 1 200px;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.stat b{font-weight:600}
.streak{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";flex:none;width:15px;height:15px;border:2px solid currentColor;border-radius:4px;box-sizing:border-box;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1}
.chip[aria-pressed="true"]::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chiphead{font-size:13px;color:var(--muted);margin:0 0 -6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px;align-items:center}
.q{font-family:var(--display);font-weight:600;font-size:clamp(16px,3.6vw,20px);text-align:center;margin:0;text-wrap:balance}
.big{width:min(220px,58vw);height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.opts{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:500 15px var(--body);text-align:left;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.pic{justify-content:center;padding:14px;position:relative}
.opt.pic .k{position:absolute;left:8px;top:8px}
.opt.pic svg{width:min(120px,30vw);height:auto}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.tab:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{width:100%;border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--bad-bg)}
.fb svg{flex:none;width:64px;height:64px}
.fb .t{font-weight:600;margin:0 0 4px}
.fb.ok .t{color:var(--ok)} .fb.no .t{color:var(--bad)}
.fb p{margin:0}
.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.btn{font:600 15px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.ghost{font:500 13px var(--body);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px}
h2{font-family:var(--display);font-weight:600;font-size:17px;margin:12px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.gi svg{flex:none;width:58px;height:58px}
.gi .n{font-weight:600;font-size:14px;margin:2px 0}
.gi .d{font-size:13px;color:var(--muted);margin:0}
.gi .ok{color:var(--ok);font-size:12px;font-weight:600}
.opt span{min-width:0;overflow-wrap:anywhere}
.sheet{width:100%}
.sheet .in{display:flex;flex-direction:column;align-items:center;gap:12px}
.sheet .fb{min-width:0}
@media (max-width:600px){
  header{padding-block:10px 0} h1{font-size:18px} .tab{padding:6px 10px;font-size:13px} .road{margin-top:10px;height:4px}
  main{padding-block:10px 16px;gap:10px} #quiz{gap:10px!important}
  .stats{font-size:13px;gap:6px 12px}
  .chips{gap:5px}
  .chip{white-space:nowrap;padding:4px 8px;font-size:12px;gap:5px}
  .chiphead{display:none}
  .foot{display:none}
  .card{padding:12px;gap:10px;border-radius:12px}
  .big{width:min(140px,20vh)}
  .q{font-size:15px}
  .opts{gap:8px}
  .opt{font-size:13.5px;padding:9px 10px;line-height:1.25}
  .opt .k{display:none}
  .opt.pic{padding:8px}
  .opt.pic svg{width:min(84px,13vh)}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.open main{padding-bottom:200px}
  .sheet .in{flex-direction:column;align-items:stretch;gap:8px}
  .sheet .fb{font-size:14px;line-height:1.35}
  .sheet .fb svg{width:40px;height:40px}
  .sheet .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header><div class="hwrap">
  <h1>Знаки ПДД</h1>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-quiz" role="tab" aria-selected="true">Тренировка</button>
    <button class="tab" id="tab-all" role="tab" aria-selected="false">Все знаки</button>
  </div>
</div><div class="road"></div></header>

<main>
  <section id="quiz" style="display:flex;flex-direction:column;gap:16px">
    <div class="stats">
      <span class="stat">Выучено <b id="learned">0</b> из <b id="total">0</b></span>
      <div class="bar"><i id="barfill"></i></div>
      <span class="streak" id="streak">Серия: 0</span>
    </div>
    <p class="chiphead">Отметь галочками, какие знаки спрашивать:</p>
    <div class="chips" id="chips"></div>
    <div class="card" id="card"></div>
    <div class="foot">
      <span>Клавиши 1–4 — ответ, Enter — дальше. Знак выучен после 2 верных ответов подряд.</span>
      <button class="ghost" id="reset">Сбросить прогресс</button>
    </div>
  </section>
  <section id="all" hidden></section>
</main>

const endLines=`<g stroke="${K}" stroke-width="2.4"><line x1="24" y1="80" x2="80" y2="24"/><line x1="20" y1="74" x2="74" y2="20"/><line x1="28" y1="84" x2="84" y2="28"/></g>`;

const blueNo=i=>`<circle cx="50" cy="50" r="43" fill="${B}" stroke="${R}" stroke-width="8"/>`+i+`<path d="M23 23 L77 77" stroke="${R}" stroke-width="8"/>`;
const rslash=`<line x1="22" y1="78" x2="78" y2="22" stroke="${R}" stroke-width="6"/>`;

const BY=Object.fromEntries(SIGNS.map(s=>[s.id,s]));
const svgOf=(s,label)=>`<svg viewBox="0 0 100 100" role="img" aria-label="${label??s.name}">${s.svg}</svg>`;

const KEY='znaki-pdd-v1';
let prog={}; try{prog=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}};
let cats=new Set(Object.keys(CATS));
try{const c=JSON.parse(localStorage.getItem('znaki-cats'));if(Array.isArray(c)){const v=c.filter(k=>k in CATS);if(v.length)cats=new Set(v)}}catch(e){}
const saveCats=()=>{try{localStorage.setItem('znaki-cats',JSON.stringify([...cats]))}catch(e){}};
let streak=0, qn=0, recent=[], comeback=[], cur=null, timer=null;
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>SIGNS.filter(s=>cats.has(s.cat));
const box=id=>prog[id]||0;

function stats(){
  const p=pool(), l=p.filter(s=>box(s.id)>=2).length;
  $('learned').textContent=l; $('total').textContent=p.length;
  $('barfill').style.width=(p.length?l/p.length*100:0)+'%';
  $('streak').textContent='Серия: '+streak;
}
function pick(){
  const p=pool(), ids=new Set(p.map(s=>s.id));
  const i=comeback.findIndex(c=>c.due<=qn&&ids.has(c.id));
  if(i>=0){const id=comeback[i].id;comeback.splice(i,1);return BY[id]}
  let c=p.filter(s=>!recent.includes(s.id)); if(!c.length)c=p;
  const w=c.map(s=>[1,4,6][Math.min(2,2-box(s.id))]||1), total=w.reduce((a,b)=>a+b,0);
  let r=Math.random()*total; for(let k=0;k<c.length;k++){r-=w[k];if(r<=0)return c[k]} return c[0];
}
function openSheet(html){
  closeSheet();
  const phone=matchMedia('(max-width:600px)').matches;
  const sh=document.createElement('div');sh.id='sheet';sh.className='sheet';
  (phone?document.body:$('fbx')).appendChild(sh);
  sh.innerHTML=html; if(phone)document.body.classList.add('open');
}
function closeSheet(){const sh=document.getElementById('sheet');if(sh)sh.remove();document.body.classList.remove('open')}
function next(){
  clearTimeout(timer); closeSheet(); qn++;
  const s=pick(); recent=[s.id,...recent].slice(0,Math.min(4,pool().length-1));
  const same=shuffle(SIGNS.filter(x=>x.cat===s.cat&&x.id!==s.id)).slice(0,2);
  const rest=shuffle(SIGNS.filter(x=>x.id!==s.id&&!same.includes(x)));
  const opts=shuffle([s,...same,...rest].slice(0,4).concat([]).filter((v,i,a)=>a.indexOf(v)===i)).slice(0,4);
  if(!opts.includes(s))opts[0]=s, shuffle(opts);
  cur={s,opts,rev:Math.random()<.35,done:false};
  draw();
}
function draw(){
  const {s,opts,rev}=cur;
  $('card').innerHTML=rev
    ?`<p class="q">Где знак «${s.name}»?</p><div class="opts">${opts.map((o,i)=>`<button class="opt pic" id="o${i}" data-i="${i}"><span class="k">${i+1}</span>${svgOf(o,'Вариант '+(i+1))}</button>`).join('')}</div><div id="fbx" style="width:100%"></div>`
    :`${svgOf(s,'Знак')}<p class="q">Что это за знак?</p><div class="opts text">${opts.map((o,i)=>`<button class="opt" id="o${i}" data-i="${i}"><span class="k">${i+1}</span><span>${o.name}</span></button>`).join('')}</div><div id="fbx" style="width:100%"></div>`;
  if(!rev)$('card').firstElementChild.classList.add('big');
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  stats();
}
function answer(i){
  if(!cur||cur.done)return; cur.done=true;
  const {s,opts}=cur, ok=opts[i]===s;
  opts.forEach((o,k)=>{const b=$('o'+k);b.disabled=true;if(o===s)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  if(ok){prog[s.id]=Math.min(3,box(s.id)+1);streak++}
  else{prog[s.id]=0;streak=0;comeback.push({id:s.id,due:qn+3})}
  save(); stats();
  const learnedNow=ok&&box(s.id)===2;
  openSheet(`<div class="in"><div class="fb ${ok?'ok':'no'}">${svgOf(s)}<div style="min-width:0"><p class="t">${ok?(learnedNow?'Верно! Знак выучен ✓':'Верно!'):'Неверно. Это «'+s.name+'»'}</p><p>${s.info}</p><p class="num">Знак ${s.id} · ${CATS[s.cat]}</p></div></div><button class="btn" id="nextb">Дальше →</button></div>`);
  $('nextb').onclick=next; $('nextb').focus({preventScroll:true});
}
function chips(){
  $('chips').innerHTML=Object.keys(CATS).map(k=>`<button class="chip" id="c-${k}" aria-pressed="${cats.has(k)}" title="${CATS[k]}">${SHORT[k]}</button>`).join('');
  Object.keys(CATS).forEach(k=>$('c-'+k).onclick=()=>{
    if(cats.has(k)){if(cats.size>1)cats.delete(k)}else cats.add(k);
    saveCats();
    recent=[];chips();next();
  });
}
function gallery(){
  $('all').innerHTML=Object.entries(CATS).map(([k,v])=>`<h2>${v}</h2><div class="grid">${SIGNS.filter(s=>s.cat===k).map(s=>`<div class="gi">${svgOf(s)}<div style="min-width:0"><span class="num">${s.id}</span>${box(s.id)>=2?' <span class="ok">✓ выучен</span>':''}<p class="n">${s.name}</p><p class="d">${s.info}</p></div></div>`).join('')}</div>`).join('');
}
function tab(which){
  const q=which==='quiz';
  $('tab-quiz').setAttribute('aria-selected',q);$('tab-all').setAttribute('aria-selected',!q);
  $('quiz').hidden=!q;$('quiz').style.display=q?'flex':'none';$('all').hidden=q;
  if(!q){clearTimeout(timer);closeSheet();gallery()}else if(cur&&cur.done)next();
}
$('tab-quiz').onclick=()=>tab('quiz');$('tab-all').onclick=()=>tab('all');
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='Точно сбросить? Нажми ещё раз';setTimeout(()=>{armed=false;$('reset').textContent='Сбросить прогресс'},3000);return}
  prog={};streak=0;comeback=[];save();armed=false;$('reset').textContent='Сбросить прогресс';next();
};
document.addEventListener('keydown',e=>{
  if($('quiz').hidden||!cur)return;
  if(!cur.done&&/^[1-4]$/.test(e.key))answer(+e.key-1);
  else if(cur.done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next()}
});
chips();next();
</script>
